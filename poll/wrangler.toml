name = "napvote-poll"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
# adresse protégée par les règles de sécurité de Cloudflare (la zone napvote-ht.com doit être active)
routes = [{ pattern = "poll.napvote-ht.com", custom_domain = true }]
preview_urls = false

[vars]
# sites autorisés à appeler le service (le premier sert de valeur par défaut)
ALLOWED_ORIGINS = "https://napvote-ht.com,https://www.napvote-ht.com"
# liste des candidats autorisés, publiée par le site (régénérée toutes les 2 h)
OPTIONS_URL = "https://napvote-ht.com/data/poll-options.json"
# nombre maximal de votes enregistrés par jour et par empreinte réseau (réseaux mobiles partagés)
RATE_LIMIT = "100"
# plafond de nouveaux appareils par jour pour un même groupe (réseau + signature) ; 0 = détection seulement, aucun blocage
CLUSTER_MAX = "0"
# les choix d'un groupe ne sont comptés qu'à partir de ce nombre d'envois dans la journée (protège les petits groupes)
CLUSTER_TRACK = "10"
# les choix de président d'un opérateur réseau ne sont comptés qu'à partir de ce nombre d'envois dans la journée
ASN_TRACK = "30"
# refuse les envois venant d'hébergeurs de serveurs, de VPN et de relais privés ("0" pour désactiver)
BLOCK_HOSTING = "1"
# si renseigné, les envois qui n'arrivent pas par ce nom d'hôte sont refusés (à activer après la transition : VOTE_HOST = "poll.napvote-ht.com")
VOTE_HOST = ""

# recalage exact des totaux, une fois par heure
[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "napvote-poll"
database_id = "93049d53-7caa-44ec-9bd7-90465cdf5629"

# Secrets à créer avec « npx wrangler secret put » :
#   SALT              : chaîne aléatoire longue (obligatoire)
#   TURNSTILE_SECRET  : clé secrète Cloudflare Turnstile (facultatif, active l'anti-robot)
